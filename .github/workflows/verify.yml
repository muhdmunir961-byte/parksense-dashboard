name: ParkSense quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    name: Secure dashboard and model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check server
        run: node --check server.js
      - name: Validate dashboard, real-3D list, endpoint contracts and firmware restrictions
        run: npm test
      - name: Syntax check one-time ESP32 configuration wizard
        run: python3 -m py_compile tools/setup_firmware.py

  firmware:
    name: Build ESP32 main (cloud OFF + ON) and sensor example
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: platformio-esp32-v2-${{ hashFiles('firmware/**/platformio.ini') }}
      - name: Install PlatformIO CLI
        run: python -m pip install --upgrade platformio
      - name: Compile safe offline ESP32 main (no secrets)
        run: pio run -d firmware/esp32-main
      - name: Compile HTTPS-enabled ESP32 main with throwaway test config
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f firmware/esp32-main/include/cloud_config.h' EXIT
          cat > firmware/esp32-main/include/cloud_config.h <<'HEADER'
          #pragma once
          #define CLOUD_UPLINK_ENABLED true
          #define CLOUD_WIFI_SSID "TEST_CHANNEL_1_WIFI"
          #define CLOUD_WIFI_PASSWORD "TEST_NOT_A_REAL_PASSWORD"
          #define CLOUD_API_URL "https://parkingdashboard.my.id/api/device/telemetry"
          #define CLOUD_DEVICE_TOKEN "TEST_ONLY_DO_NOT_USE_FAKE_SECRET_123456789"
          #define PARKSENSE_AP_PASSWORD "TEST_AP_PASSWORD_123456"
          HEADER
          pio run -d firmware/esp32-main -t clean
          pio run -d firmware/esp32-main
      - name: Compile ESP-NOW sensor pod example
        run: pio run -d firmware/esp32-sensor
