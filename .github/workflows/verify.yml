name: ParkSense quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    name: Secure dashboard and model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check server
        run: node --check server.js
      - name: Validate dashboard, real-3D list, endpoint contracts and firmware restrictions
        run: npm test
      - name: Syntax check one-time ESP32 configuration wizard
        run: python3 -m py_compile tools/setup_firmware.py

  firmware:
    name: Build ESP32 main (cloud OFF + ON) and sensor example
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: platformio-esp32-v2-${{ hashFiles('firmware/**/platformio.ini') }}
      - name: Install PlatformIO CLI
        run: python -m pip install --upgrade platformio
      - name: Compile one-file cloud-ready ESP32 main (no secrets)
        run: pio run -d firmware/esp32-main
      - name: Compile offline fallback without cloud
        shell: bash
        run: |
          set -euo pipefail
          file="firmware/esp32-main/src/main.cpp"
          cp "$file" "$file.ci-backup"
          trap 'mv "$file.ci-backup" "$file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('firmware/esp32-main/src/main.cpp')
          text = p.read_text()
          old = '#define CLOUD_UPLINK_ENABLED true'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '#define CLOUD_UPLINK_ENABLED false'))
          PY
          pio run -d firmware/esp32-main -t clean
          pio run -d firmware/esp32-main
      - name: Compile ESP-NOW sensor pod example
        run: pio run -d firmware/esp32-sensor
